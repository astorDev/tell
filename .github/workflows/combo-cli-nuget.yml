name: Tell.Cli (Combo) NuGet
on:
  push:
    paths:
      - 'combo/cli/**'
      - '.github/workflows/combo-cli-nuget.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Pack & Publish nuget
    runs-on: ubuntu-latest
    steps:
      - uses: astorDev/versy/calver/nuget@main
        with:
          project: combo/cli/Tell.Cli
          nuget-api-key: ${{ secrets.NUGET_API_KEY }}